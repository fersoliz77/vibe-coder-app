name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      npm_config_msvs_version: "2022"
      VIBE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VIBE_SUPABASE_ANON_KEY: ci-public-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record non-deployable artifact metadata
        shell: pwsh
        run: |
          @(
            "classification=ci-smoke-non-deployable"
            "repository=$env:GITHUB_REPOSITORY"
            "commit=$env:GITHUB_SHA"
            "run_id=$env:GITHUB_RUN_ID"
            "configuration=ci-placeholders"
            "release=false"
          ) | Set-Content -Path ci-smoke-artifact-metadata.txt -Encoding utf8

      - name: Set up Python for node-gyp
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild node-pty for Electron
        run: npm run rebuild -- -w node-pty

      - name: Run tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results.xml "tests/**/*.test.js"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-non-deployable-desktop-test-results
          path: |
            test-results.xml
            ci-smoke-artifact-metadata.txt
            scripts/CI_SMOKE_NON_DEPLOYABLE_README.txt
          if-no-files-found: error
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Build unpacked non-deployable Windows CI smoke artifact
        run: npm run package:dir

      - name: Upload non-deployable Windows smoke build
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-non-deployable-desktop-windows-unpacked
          path: |
            dist/
            dist-electron/
            ci-smoke-artifact-metadata.txt
            scripts/CI_SMOKE_NON_DEPLOYABLE_README.txt
          if-no-files-found: error
          retention-days: 7
