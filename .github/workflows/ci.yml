name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      npm_config_msvs_version: "2022"
      VIBE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VIBE_SUPABASE_ANON_KEY: ci-public-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild node-pty for Electron
        run: npm run rebuild -- -w node-pty

      - name: Run tests when configured
        run: npm test --if-present

      - name: Build
        run: npm run build

      - name: Verify unpacked Windows package
        run: npm run package:dir
