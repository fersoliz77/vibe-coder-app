name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      VIBE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VIBE_SUPABASE_ANON_KEY: ci-public-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record non-deployable artifact metadata
        shell: pwsh
        run: |
          @(
            "classification=ci-smoke-non-deployable"
            "repository=$env:GITHUB_REPOSITORY"
            "commit=$env:GITHUB_SHA"
            "run_id=$env:GITHUB_RUN_ID"
            "configuration=ci-placeholders"
            "release=false"
          ) | Set-Content -Path ci-smoke-artifact-metadata.txt -Encoding utf8

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results.xml "tests/**/*.test.js"

      # `continue-on-error` porque estos artefactos son diagnostico, no el
      # resultado: cuando se lleno la cuota de almacenamiento de la cuenta, la
      # subida fallo y el job murio ANTES de correr los gates, reportando como
      # fallo de codigo algo que no lo era y ocultando si el codigo estaba bien.
      # Que no se pueda guardar un informe no dice nada sobre el commit.
      - name: Upload test results
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-smoke-non-deployable-desktop-test-results
          path: |
            test-results.xml
            ci-smoke-artifact-metadata.txt
            scripts/CI_SMOKE_NON_DEPLOYABLE_README.txt
          if-no-files-found: error
          retention-days: 7

      # Antes de esto el escritorio no corria ningun gate de diseno, contraste,
      # accesibilidad ni bundle: los scripts ni existian en este repositorio.
      # Ahora es el mismo comando que corre el desarrollador, e incluye build.
      - name: Run the full local gate
        run: npm run check

      - name: Build unpacked non-deployable Windows CI smoke artifact
        run: npm run package:dir

      # Este es el que llena la cuota: `dist-electron/` es la app desempaquetada
      # y pesa cientos de MB por corrida. Con siete dias de retencion y varios
      # push por dia, la cuenta acumulo casi 10 GB.
      #
      # Lo que se quiere comprobar es que el empaquetado NO FALLA, y eso ya lo
      # dice el paso anterior. Guardar el resultado solo sirve para inspeccionar
      # una corrida puntual, asi que baja a dos dias y deja de subir la app
      # desempaquetada: con `dist/` alcanza para mirar que se genero.
      - name: Upload non-deployable Windows smoke build
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-smoke-non-deployable-desktop-windows-unpacked
          path: |
            dist/
            ci-smoke-artifact-metadata.txt
            scripts/CI_SMOKE_NON_DEPLOYABLE_README.txt
          if-no-files-found: error
          retention-days: 2
