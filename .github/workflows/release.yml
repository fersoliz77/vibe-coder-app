name: Publish private desktop release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-stable
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 50
    environment: production
    env:
      VIBE_UPDATE_CHANNEL: stable
      VIBE_UPDATE_URL: https://vibe-desktop-updates.vibe-ide-coder.workers.dev

    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.ref) || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Validate release identity and secrets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $releaseTag = $env:RELEASE_TAG
          if ($releaseTag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Release tag has an invalid format." }
          if ($releaseTag -ne "v$($package.version)") { throw "Tag $releaseTag does not match package version $($package.version)." }
          git show-ref --verify --quiet "refs/tags/$releaseTag"
          if ($LASTEXITCODE -ne 0) { throw "$releaseTag is not an existing tag." }
          "RELEASE_VERSION=$($package.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate release secrets
        shell: pwsh
        env:
          VIBE_SUPABASE_URL: ${{ secrets.VIBE_SUPABASE_URL }}
          VIBE_SUPABASE_ANON_KEY: ${{ secrets.VIBE_SUPABASE_ANON_KEY }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          foreach ($name in @('VIBE_SUPABASE_URL', 'VIBE_SUPABASE_ANON_KEY', 'UPDATE_SIGNING_PRIVATE_KEY')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) { throw "Required release secret is missing: $name" }
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete quality gate
        run: npm run check

      - name: Build NSIS release
        env:
          VIBE_SUPABASE_URL: ${{ secrets.VIBE_SUPABASE_URL }}
          VIBE_SUPABASE_ANON_KEY: ${{ secrets.VIBE_SUPABASE_ANON_KEY }}
          VIBE_AUTH_HELP_URL: ${{ secrets.VIBE_AUTH_HELP_URL }}
        run: npm run package -- --publish never

      - name: Sign update metadata with the free private key
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: npm run release:sign-update

      - name: Verify installer structure
        shell: pwsh
        run: |
          $installer = "dist-electron/Vibe-IDE-Code-Setup-$env:RELEASE_VERSION.exe"
          $application = 'dist-electron/win-unpacked/Vibe IDE Code.exe'
          npm run release:verify-installer -- "$installer" "$application"

      - name: Generate and validate release evidence
        shell: pwsh
        env:
          VIBE_SUPABASE_URL: ${{ secrets.VIBE_SUPABASE_URL }}
        run: |
          $installer = "dist-electron/Vibe-IDE-Code-Setup-$env:RELEASE_VERSION.exe"
          $remoteName = "Vibe-IDE-Code-Setup-$env:RELEASE_VERSION.exe"
          $url = "$env:VIBE_UPDATE_URL/$env:VIBE_UPDATE_CHANNEL/$remoteName"
          $checksum = "temp/build/Vibe-IDE-Code-Setup-$env:RELEASE_VERSION.exe.sha256"
          npm run release:manifest -- --installer "$installer" --version "$env:RELEASE_VERSION" --channel stable --url "$url" --minimum-backend 1.0.0 --minimum-client "$env:RELEASE_VERSION" --output temp/build/release-manifest.json --checksum "$checksum"
          npm run release:validate -- temp/build/release-manifest.json "$installer" "$checksum"

      - name: Publish binaries and activate metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
        run: npm run release:publish

      - name: Preserve release evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release-${{ env.RELEASE_VERSION }}-evidence
          path: |
            dist-electron/latest.yml
            dist-electron/Vibe-IDE-Code-Setup-*.exe
            dist-electron/Vibe-IDE-Code-Setup-*.exe.blockmap
            temp/build/release-manifest.json
            temp/build/*.sha256
          if-no-files-found: error
          retention-days: 90
